name: Apply FrameFlow Studio V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.frameflow-bootstrap/**'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack release
        shell: bash
        run: |
          set -euo pipefail
          cat .frameflow-bootstrap/part* > /tmp/frameflow.b64
          base64 -d /tmp/frameflow.b64 > /tmp/frameflow.tar.gz
          echo "1c07163c03264d8dd4d336f60aea7c67359fb27b4b415b7287ee2ae69207424c  /tmp/frameflow.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .frameflow-bootstrap -exec rm -rf {} +
          tar -xzf /tmp/frameflow.tar.gz -C .
          rm -rf .frameflow-bootstrap

      - name: Commit V2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild FrameFlow Studio V2"
          git push
